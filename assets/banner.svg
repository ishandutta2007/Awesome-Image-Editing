<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.25" />
    </linearGradient>

    <radialGradient id="meshOrb1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshOrb2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshOrb3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for Glow Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      /* Animated Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(3deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-3deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes beamScan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-2 {
        animation: floatReverse 8.5s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-3 {
        animation: floatSlow 9s ease-in-out infinite reverse;
        transform-origin: center;
      }
      .glow-pulse {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: dashMove 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Kept behind) -->
  <circle cx="200" cy="90" r="180" fill="url(#meshOrb1)" class="glow-pulse" />
  <circle cx="1020" cy="270" r="220" fill="url(#meshOrb2)" class="glow-pulse" />
  <circle cx="620" cy="180" r="160" fill="url(#meshOrb3)" />

  <!-- Subtle Tech Grid Lines in Background -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Curved Graphic Streams in Backdrop -->
  <path d="M -50 310 C 250 310, 320 60, 620 70 C 920 80, 950 320, 1250 310" 
        fill="none" stroke="url(#primaryGlow)" stroke-width="2.5" stroke-opacity="0.4" class="stream-line" />
  <path d="M -50 50 C 220 50, 380 290, 680 280 C 980 270, 1020 90, 1250 90" 
        fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" class="stream-line" style="animation-direction: reverse; animation-duration: 6s;" />

  <!-- Dynamic Aesthetic Floating Elements (Positioned away from center text) -->
  <!-- Left Side Visual Element: Layer Stack / Canvas Palette -->
  <g class="floating-card-1" opacity="0.85">
    <rect x="75" y="195" width="130" height="90" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1.2" />
    <circle cx="100" cy="225" r="10" fill="#ec4899" fill-opacity="0.8" />
    <circle cx="125" cy="225" r="10" fill="#8b5cf6" fill-opacity="0.8" />
    <circle cx="150" cy="225" r="10" fill="#3b82f6" fill-opacity="0.8" />
    <rect x="95" y="250" width="85" height="7" rx="3.5" fill="#64748b" fill-opacity="0.7" />
    <rect x="95" y="263" width="55" height="6" rx="3" fill="#475569" fill-opacity="0.7" />
  </g>

  <!-- Right Side Visual Element: AI / Neural Filter Node Badge -->
  <g class="floating-card-2" opacity="0.85">
    <rect x="990" y="80" width="135" height="95" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
    <text x="1010" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="700" fill="#c084fc">✨ AI ENGINE</text>
    <rect x="1010" y="128" width="95" height="8" rx="4" fill="#38bdf8" fill-opacity="0.5" />
    <rect x="1010" y="145" width="70" height="8" rx="4" fill="#a855f7" fill-opacity="0.5" />
    <circle cx="1100" cy="110" r="4" fill="#10b981" />
  </g>

  <!-- Bottom Right Floating Node -->
  <g class="floating-card-3" opacity="0.85">
    <rect x="1010" y="210" width="120" height="65" rx="8" fill="#1e293b" fill-opacity="0.55" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="1025" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="12" font-weight="600" fill="#94a3b8">RAW / PSD / AI</text>
    <rect x="1025" y="247" width="85" height="6" rx="3" fill="#64748b" fill-opacity="0.6" />
  </g>

  <!-- Central Foreground Content (Title, Subtitle, Highlights) - Always On Top -->
  <g transform="translate(600, 0)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect x="-165" y="0" width="330" height="32" rx="16" fill="url(#badgeGrad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" />
      <text x="0" y="21" class="tag-text" fill="#e9d5ff">🎨 THE OPEN CREATIVE STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="150" class="title-text" fill="url(#textGrad)">Awesome Image Editing</text>

    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle-text">Curated SaaS Platforms, AI Workflows &amp; Open-Source Creative Ecosystem</text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 260)">
      <!-- Pillar 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-95" y="-16" width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#475569" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#f8fafc">📸 Photo Retouching</text>
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(0, 0)">
        <rect x="-95" y="-16" width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#8b5cf6" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#f8fafc">🤖 AI &amp; Neural Tools</text>
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(230, 0)">
        <rect x="-95" y="-16" width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.75" stroke="#ec4899" stroke-width="1" />
        <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#f8fafc">⚡ Open-Source First</text>
      </g>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-opacity="0.35" />
</svg>
